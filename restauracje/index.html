      .r-nav { position: sticky; top: 0; z-index: 40; background: rgba(255,249,249,0.92);

                     gap: 1rem; flex-wrap: wrap; }
      .r-brand { font-weight: 800; color: var(--rose); text-decoration: none; font-size: 1.15rem; margin-right: auto; }
      .r-brand span { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
      .r-nav a.r-navlink, .r-nav button.r-navlink {
        background: none; border: none; cursor: pointer; color: var(--text); text-decoration: none;

      .r-nav a.r-navlink:hover, .r-nav button.r-navlink:hover { background: var(--rose-lt); color: var(--rose); }
      .r-fodmap-wrap { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-left: auto; }
      .r-fodmap-label { font-size: 0.82rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .r-fodmap-wrap .chips { margin: 0; }
      .r-fodmap-wrap .chip { padding: 0.28rem 0.7rem; font-size: 0.82rem; }

      .r-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 4rem; position: relative; z-index: 1; }
      .r-top { text-align: center; margin-bottom: 1.5rem; }
      .r-top h1 { color: var(--rose); font-size: clamp(1.8rem, 5vw, 2.6rem); }
      .r-top p { color: var(--muted); margin-top: 0.5rem; }

      .r-controls { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; align-items: center; margin-bottom: 1rem; }
      .r-search { flex: 1 1 240px; max-width: 320px; padding: 0.6rem 0.9rem; border: 1px solid var(--rose-lt);
                  border-radius: 100px; font-size: 1rem; outline: none; }
      .r-search:focus { border-color: var(--rose); }
      .r-select { padding: 0.55rem 0.9rem; border: 1px solid var(--rose-lt); border-radius: 100px; font-size: 0.95rem;
                  background: var(--card); color: var(--text); cursor: pointer; outline: none; }
      .r-select:focus { border-color: var(--rose); }
      .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-bottom: 0.8rem; }
      .chip { border: 1px solid var(--rose-lt); background: var(--card); color: var(--muted); border-radius: 100px;
              padding: 0.35rem 0.9rem; font-size: 0.88rem; cursor: pointer; transition: all 0.15s; }
      .chip:hover { border-color: var(--rose); }
      .chip.active { background: var(--rose); color: #fff; border-color: var(--rose); }

      .r-count { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
      .r-reset { background: none; border: none; color: var(--rose); cursor: pointer; font-size: 0.85rem; text-decoration: underline; }

      .r-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
      .r-card { background: var(--card); border: 1px solid var(--rose-lt); border-radius: 1rem; padding: 1.1rem 1.2rem;

      .r-card:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(200, 60, 90, 0.18); }
      .r-card h3 { color: var(--text); font-size: 1.12rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.4rem; }
      .r-card .r-type { color: var(--rose); font-size: 0.85rem; font-weight: 600; }
      .r-card .r-meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; line-height: 1.45; }

      .r-badge.g { background: #e4f6e8; color: #1e7d38; }
      .r-badge.y { background: #fff4dd; color: #9a6a10; }
      .r-badge.r { background: #fde4e4; color: #b23030; }

      .r-modal { position: fixed; inset: 0; background: rgba(45, 26, 32, 0.55); display: none; align-items: flex-start;
                 justify-content: center; padding: 2rem 1rem; z-index: 60; overflow-y: auto; }
      .r-modal.open { display: flex; }
      .r-dialog { background: var(--cream); border-radius: 1.1rem; max-width: 720px; width: 100%; box-shadow: var(--shadow); overflow: hidden; }
      .r-dialog-head { background: var(--rose); color: #fff; padding: 0.8rem 1.3rem; display: flex; align-items: center;

      .r-dialog-head span { font-weight: 700; letter-spacing: 0.05em; }
      .r-close { background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 1.3rem; line-height: 1;
                 width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer; }
      .r-close:hover { background: rgba(255,255,255,0.35); }
      .r-body { padding: 1.4rem 1.6rem 2rem; line-height: 1.7; }

      /* Pasek linków restauracji */
      .r-links { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.2rem 0 1.2rem; }
      .r-link { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.85rem; border-radius: 100px;
                text-decoration: none; font-size: 0.88rem; font-weight: 600; border: 1px solid var(--rose-lt);
                background: var(--card); color: var(--text); transition: all 0.15s; }

      .r-link.muted { opacity: 0.4; filter: grayscale(1); font-weight: 500; }
      .r-link.muted:hover { opacity: 0.7; transform: none; }
      .r-links-note { font-size: 0.78rem; color: var(--muted); margin: -0.6rem 0 1.2rem; }

      /* Menu podzielone na działy */
      .r-body h1 { font-size: 1.6rem; color: var(--rose); margin-bottom: 0.3rem; }
      .r-body h2 { display: none; } /* podtytuł opisowy pomijamy w podglądzie – kluczowe dane są w pasku linków */
      .r-section { background: var(--card); border: 1px solid var(--rose-lt); border-radius: 0.9rem; overflow: hidden; margin: 0.9rem 0; }
      .r-section > .r-section-title { background: var(--rose-lt); color: var(--rose); font-weight: 800; font-size: 0.95rem;

      .r-section ul { list-style: none; padding: 0.3rem 1rem 0.6rem; margin: 0; }
      .r-section li { padding: 0.32rem 0; border-bottom: 1px dashed var(--rose-lt); font-size: 0.95rem; }
      .r-section li:last-child { border-bottom: none; }
      .r-body p { margin: 0.5rem 0; }
      .r-body p.r-desc { color: var(--muted); font-size: 0.92rem; margin-bottom: 0.6rem; }
      .r-loading, .r-error { text-align: center; color: var(--muted); padding: 2rem; }
      .r-error a { color: var(--rose); }

      ];

      const FBADGE = { g: ["g","🟢 łatwo"], y: ["y","🟡 z modyfikacjami"], r: ["r","🔴 trudno"] };

      let filterDistrict = "Wszystkie", filterFodmap = "all", filterType = "all", query = "";

      const grid = document.getElementById("grid");
      const countEl = document.getElementById("count");

      // Dropdown: dzielnica
      const districtSelect = document.getElementById("district-select");
      districtSelect.innerHTML =
        `<option value="Wszystkie">Wszystkie dzielnice</option>` +
        `<option value="Wilanów">Wilanów</option>` +
        `<option value="Ursynów">Ursynów</option>`;
      districtSelect.onchange = () => { filterDistrict = districtSelect.value; render(); };

      // Dropdown: typ kuchni
      const typeSelect = document.getElementById("type-select");
      const types = [...new Set(DATA.map(r => r.c))].sort((a,b) => a.localeCompare(b,"pl"));
      typeSelect.innerHTML = `<option value="all">Wszystkie typy kuchni</option>` +
        types.map(t => `<option value="${t}">${t}</option>`).join("");
      typeSelect.onchange = () => { filterType = typeSelect.value; render(); };

      // Filtr FODMAP (zawsze widoczny w nawigacji)
      function refreshChips() {
        const box = document.getElementById("fodmap-chips");
        box.innerHTML = "";
        [["all","Wszystkie"],["g","🟢 łatwo"],["y","🟡 z modyfikacjami"],["r","🔴 trudno"]]
          .forEach(([val, label]) => {
            const b = document.createElement("button");
            b.className = "chip" + (val === filterFodmap ? " active" : "");
            b.textContent = label;
            b.onclick = () => { filterFodmap = val; render(); refreshChips(); };
            box.appendChild(b);
          });
      }

      function render() {
        const q = query.trim().toLowerCase();
        const list = DATA.filter(r =>
          (filterDistrict === "Wszystkie" || r.d === filterDistrict) &&
          (filterFodmap === "all" || r.f === filterFodmap) &&
          (filterType === "all" || r.c === filterType) &&
          (q === "" || r.n.toLowerCase().includes(q) || r.t.toLowerCase().includes(q) || r.c.toLowerCase().includes(q))
        );
        grid.innerHTML = "";
        list.forEach(r => {
          const card = document.createElement("div");
          card.className = "r-card";
          const [cls, title] = FBADGE[r.f];
          card.innerHTML =
            `<h3>${esc(r.n)} <span class="r-badge ${cls}" title="low FODMAP: ${title}">${title.split(" ")[0]}</span></h3>` +
            `<div class="r-type">${esc(r.c)} · ${esc(r.d)}</div>` +
            `<div class="r-meta">📍 ${esc(r.a)}<br>🕒 ${esc(r.h)}</div>`;
          card.onclick = () => openModal(r);
          grid.appendChild(card);
        });
        countEl.innerHTML = `Znaleziono: <strong>${list.length}</strong> z ${DATA.length} restauracji` +
          (list.length < DATA.length ? ` · <button class="r-reset" id="reset">wyczyść filtry</button>` : "");
        const rb = document.getElementById("reset");
        if (rb) rb.onclick = resetFilters;
      }

      function resetFilters() {
        filterDistrict = "Wszystkie"; filterFodmap = "all"; filterType = "all"; query = "";
        document.getElementById("search").value = ""; typeSelect.value = "all"; districtSelect.value = "Wszystkie";
        render(); refreshChips();
      }

      function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function gsearch(q) { return "https://www.google.com/search?q=" + encodeURIComponent(q); }

      // Pasek linków: strona www, Facebook, Instagram, mapa, menu online, nasze menu (plik .md)
      function linksBar(r) {
        const lk = LINKS[r.p] || {};
        const q = `${r.n} ${r.d} Warszawa`;
        const wwwReal = r.www || lk.www;
        const fbReal  = r.fb  || lk.fb;
        const igReal  = r.ig  || lk.ig;
        const menuUrl = r.menu || lk.menu;
        const maps = "https://www.google.com/maps/search/" + encodeURIComponent(`${r.n}, ${r.a}, ${r.d}, Warszawa`);
        // Zweryfikowany link => aktywna ikona; brak => wyszarzona (klik = wyszukiwarka Google)
        const chip = (icon, label, realUrl, searchQ) => realUrl
          ? `<a class="r-link" href="${realUrl}" target="_blank" rel="noopener">${icon} ${label}</a>`
          : `<a class="r-link muted" href="${gsearch(searchQ)}" target="_blank" rel="noopener" title="Brak zweryfikowanego linku — kliknij, aby wyszukać w Google">${icon} ${label}</a>`;
        const anyMuted = !wwwReal || !fbReal || !igReal;
        return `
          <div class="r-links">
            ${chip("🌐", "Strona www", wwwReal, `${r.n} ${r.d} Warszawa restauracja`)}
            ${chip("📘", "Facebook", fbReal, `${r.n} ${r.d} Warszawa Facebook`)}
            ${chip("📸", "Instagram", igReal, `${r.n} Warszawa Instagram`)}
            <a class="r-link" href="${maps}" target="_blank" rel="noopener">🗺️ Mapa</a>
            ${menuUrl ? `<a class="r-link" href="${menuUrl}" target="_blank" rel="noopener">📋 Menu online</a>` : ""}
            <a class="r-link primary" href="${r.p}" target="_blank" rel="noopener">📋 Nasze menu</a>
          </div>
          ${anyMuted ? `<p class="r-links-note">Wyszarzone ikony = brak zweryfikowanego linku (kliknięcie otwiera wyszukiwarkę Google). 🗺️ Mapa i „Nasze menu” działają zawsze.</p>` : ""}`;
      }

      // Mini-renderer Markdown → HTML z grupowaniem działów menu (### → sekcja)
      function mdToHtml(md) {
        const lines = md.replace(/\r/g,"").split("\n");
        const inline = (s) => esc(s)
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        let html = "", listBuf = "", inList = false, inSection = false;
        const closeList = () => { if (inList) { html += `<ul>${listBuf}</ul>`; listBuf = ""; inList = false; } };
        const closeSection = () => { closeList(); if (inSection) { html += `</div>`; inSection = false; } };
        for (const raw of lines) {
          const line = raw.trimEnd();
          if (/^###\s+/.test(line)) {                       // dział menu
            closeSection();
            html += `<div class="r-section"><div class="r-section-title">${inline(line.replace(/^###\s+/,""))}</div>`;
            inSection = true;
          } else if (/^##\s+/.test(line)) {                 // podtytuł opisowy – ukryty w CSS
            closeSection(); html += `<h2>${inline(line.replace(/^##\s+/,""))}</h2>`;
          } else if (/^#\s+/.test(line)) {                  // nazwa restauracji
            closeSection(); html += `<h1>${inline(line.replace(/^#\s+/,""))}</h1>`;
          } else if (/^-\s+/.test(line)) {
            inList = true; listBuf += `<li>${inline(line.replace(/^-\s+/,""))}</li>`;
          } else if (line.trim() === "") {
            closeList();
          } else {
            closeList();
            const cls = /Gdzie zjesz na low FODMAP/i.test(line) ? "" : "r-desc";
            html += `<p class="${cls}">${inline(line)}</p>`;
          }
        }
        closeSection();
        return html;
      }

      const modal = document.getElementById("modal");
      const modalBody = document.getElementById("modal-body");
      const modalTitle = document.getElementById("modal-title");
      function openModal(r) {
        modal.classList.add("open");
        modalTitle.textContent = r.n;
        modalBody.innerHTML = linksBar(r) + `<div class="r-loading">Ładowanie menu…</div>`;
        fetch(r.p)
          .then(res => { if (!res.ok) throw new Error(res.status); return res.text(); })
          .then(txt => { modalBody.innerHTML = linksBar(r) + mdToHtml(txt); })
          .catch(() => {
            modalBody.innerHTML = linksBar(r) +
              `<div class="r-error">Podgląd menu jest dostępny po opublikowaniu strony (GitHub Pages).<br>` +
              `Otwórz plik menu bezpośrednio: <a href="${r.p}" target="_blank" rel="noopener">${esc(r.n)}</a></div>`;
          });
      }
      function closeModal() { modal.classList.remove("open"); }
      document.getElementById("close").onclick = closeModal;
      modal.onclick = (e) => { if (e.target === modal) closeModal(); };
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

      document.getElementById("search").addEventListener("input", (e) => { query = e.target.value; render(); });

      refreshChips();
      render();
    </script>
